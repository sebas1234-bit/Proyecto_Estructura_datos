<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Santa Fe - Cartelera</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/styles.css">
    <style>
        /* Diseño UX/UI para la cuadrícula de películas */
        .contenedor-cartelera {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tarjeta-pelicula {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .tarjeta-pelicula:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .poster-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
        .info-pelicula {
            padding: 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .info-pelicula h3 {
            font-size: 1.25rem;
            color: #1a1a2e;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .info-pelicula p {
            color: #666;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .btn-reservar {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn-reservar:hover {
            background-color: #b20710;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="/">Cine Santa Fe</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon" style="background-color: white; border-radius: 3px;"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="/templates/cartelera.html" style="color: #e50914 !important; font-weight: bold;">Cartelera</a></li>
                <li class="nav-item"><a class="nav-link" href="/templates/nosotros.html">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" href="/templates/login.html">Iniciar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenedor donde se inyectarán las películas mediante JS -->
    <div class="contenedor-cartelera" id="grid-peliculas">
        <!-- Las películas aparecerán aquí -->
    </div>

    <script>
        // Función para conectar el HTML con el Vector de Python
        async function cargarCartelera() {
            try {
                // AQUÍ ESTÁ LA LÍNEA QUE BUSCABAS: Ruta relativa hacia FastAPI
                const respuesta = await fetch('/api/peliculas');
                const peliculas = await respuesta.json();
                
                const contenedor = document.getElementById('grid-peliculas');
                
                // Recorremos el vector recibido y creamos las tarjetas HTML
                peliculas.forEach(pelicula => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta-pelicula';
                    
                    tarjeta.innerHTML = `
                        <img src="${pelicula.imagen}" alt="Póster de ${pelicula.titulo}" class="poster-img">
                        <div class="info-pelicula">
                            <div>
                                <h3>${pelicula.titulo}</h3>
                                <p><strong>Género:</strong> ${pelicula.genero}</p>
                                <p><strong>Duración:</strong> ${pelicula.duracion}</p>
                            </div>
                            <a href="/templates/login.html" class="btn-reservar">Reservar Asiento</a>
                        </div>
                    `;
                    contenedor.appendChild(tarjeta);
                });
            } catch (error) {
                console.error("Error al cargar la cartelera:", error);
                document.getElementById('grid-peliculas').innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>No se pudo cargar la cartelera en este momento.</p>";
            }
        }

        // Ejecutar la función cuando la página cargue
        document.addEventListener('DOMContentLoaded', cargarCartelera);
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
