<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Santa Fe - Asientos</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/styles.css">
    <style>
        .contenedor-sala {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        .pantalla {
            background: #333;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }
        .fila-asientos {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .asiento {
            width: 40px;
            height: 40px;
            border-radius: 6px 6px 12px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }
        .libre {
            background-color: #4caf50;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .libre:hover {
            transform: scale(1.1);
        }
        .ocupado {
            background-color: #e50914;
            cursor: not-allowed;
        }
        #estado-conexion {
            font-size: 0.85rem;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="/">Cine Santa Fe</a>
        <div class="collapse navbar-collapse justify-content-center">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/templates/cartelera.html">Cartelera</a></li>
            </ul>
        </div>
    </nav>

    <div class="contenedor-sala">
        <div class="pantalla">PANTALLA</div>
        <div id="grid-asientos"></div>
        <p id="estado-conexion">Conectando en tiempo real...</p>
    </div>

    <script>
        // Nombre temporal del usuario (más adelante esto vendrá del login real)
        const usuarioActual = "Invitado-" + Math.floor(Math.random() * 1000);

        function pintarAsiento(fila, columna, ocupadoPor) {
            const celda = document.querySelector(
                `[data-fila="${fila}"][data-columna="${columna}"]`
            );
            if (!celda) return;
            celda.className = "asiento " + (ocupadoPor ? "ocupado" : "libre");
            celda.textContent = ocupadoPor ? ocupadoPor[0] : "";
            celda.title = ocupadoPor ? `Ocupado por ${ocupadoPor}` : "Disponible";
        }

        async function reservarAsiento(fila, columna) {
            try {
                const respuesta = await fetch('/api/asientos/reservar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fila, columna, usuario: usuarioActual }),
                });
                const resultado = await respuesta.json();
                if (!resultado.exito) {
                    alert("Ese asiento ya fue tomado por otra persona.");
                }
                // No pintamos aquí directamente: esperamos el mensaje del
                // WebSocket, así se ve exactamente igual en todas las
                // pantallas conectadas (incluida la propia).
            } catch (error) {
                console.error("Error al reservar:", error);
            }
        }

        async function cargarAsientos() {
            try {
                const respuesta = await fetch('/api/asientos');
                const matriz = await respuesta.json();
                const contenedor = document.getElementById('grid-asientos');

                matriz.forEach((fila, indiceFila) => {
                    const divFila = document.createElement('div');
                    divFila.className = 'fila-asientos';

                    fila.forEach((asiento, indiceColumna) => {
                        const divAsiento = document.createElement('div');
                        divAsiento.className = 'asiento ' + (asiento === null ? 'libre' : 'ocupado');
                        divAsiento.textContent = asiento === null ? '' : asiento[0];
                        divAsiento.title = asiento === null ? 'Disponible' : `Ocupado por ${asiento}`;
                        divAsiento.dataset.fila = indiceFila;
                        divAsiento.dataset.columna = indiceColumna;

                        divAsiento.addEventListener('click', () => {
                            if (divAsiento.classList.contains('ocupado')) return;
                            reservarAsiento(indiceFila, indiceColumna);
                        });

                        divFila.appendChild(divAsiento);
                    });

                    contenedor.appendChild(divFila);
                });
            } catch (error) {
                console.error("Error al cargar los asientos:", error);
                document.getElementById('grid-asientos').innerHTML = "<p>No se pudo cargar la sala.</p>";
            }
        }

        function conectarWebSocket() {
            const protocolo = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocolo}//${window.location.host}/ws/asientos`);

            ws.onopen = () => {
                document.getElementById('estado-conexion').textContent = "Conectado en tiempo real ✔";
            };

            ws.onmessage = (evento) => {
                const datos = JSON.parse(evento.data);
                pintarAsiento(datos.fila, datos.columna, datos.ocupado_por);
            };

            ws.onclose = () => {
                document.getElementById('estado-conexion').textContent = "Conexión perdida, recarga la página.";
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarAsientos();
            conectarWebSocket();
        });
    </script>
</body>
</html>
