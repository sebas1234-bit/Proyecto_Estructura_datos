<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Santa Fe - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group label { font-weight: bold; }
        .btn-ingresar {
            background-color: #e50914;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        .btn-ingresar:hover { background-color: #b20710; color: white; }
        .btn-registro { background-color: #333; }
        .btn-registro:hover { background-color: #111; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="/">Cine Santa Fe</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/templates/cartelera.html">Cartelera</a></li>
                <li class="nav-item"><a class="nav-link" href="/templates/nosotros.html">Nosotros</a></li>
                <li class="nav-item" id="nav-login"><a class="nav-link" href="/templates/login.html">Iniciar Sesión</a></li>
                <li class="nav-item" id="nav-logout" style="display: none;"><a class="nav-link" href="#" onclick="cerrarSesion()" style="color: #e50914;">Cerrar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container-main">
        <div class="login-container">
            <h2 class="text-center mb-4">Acceder</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" class="form-control" id="correo" placeholder="usuario@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Tu contraseña" required>
                </div>
                <button type="button" class="btn-ingresar" onclick="iniciarSesion()">Ingresar</button>
                <button type="button" class="btn-ingresar btn-registro" onclick="registrar()">Registrarse</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = localStorage.getItem('usuarioActivo');
            if (usuario) {
                document.getElementById('nav-login').style.display = 'none';
                document.getElementById('nav-logout').style.display = 'block';
            }
        });

        function cerrarSesion() {
            localStorage.removeItem('usuarioActivo');
            window.location.href = "/"; 
        }

        async function registrar() {
            const correo = document.getElementById('correo').value;
            const contrasena = document.getElementById('password').value;
            if(!correo || !contrasena) { alert("Llena ambos campos."); return; }

            const respuesta = await fetch('/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo, contrasena })
            });
            const datos = await respuesta.json();
            alert(datos.mensaje);
        }

        async function iniciarSesion() {
            const correo = document.getElementById('correo').value;
            const contrasena = document.getElementById('password').value;
            if(!correo || !contrasena) { alert("Llena ambos campos."); return; }

            const respuesta = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo, contrasena })
            });
            const datos = await respuesta.json();
            
            if (datos.exito) {
                localStorage.setItem('usuarioActivo', correo);
                window.location.href = "/templates/asientos.html"; 
            } else {
                alert(datos.mensaje);
            }
        }
    </script>
</body>
</html>
