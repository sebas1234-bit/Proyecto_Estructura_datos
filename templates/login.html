<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Santa Fe - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/styles.css">
    <style>
        /* Estilos específicos para el formulario centralizado */
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group label {
            font-weight: bold;
        }
        .btn-ingresar {
            background-color: #e50914;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-ingresar:hover {
            background-color: #b20710;
            color: white;
        }
        .registro-link {
            text-align: center;
            margin-top: 15px;
            display: block;
            color: #1a1a2e;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación compartida -->
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="inicio.html">Cine Santa Fe</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="inicio.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="cartelera.html">Cartelera</a></li>
                <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenedor del Formulario -->
    <div class="container-main">
        <div class="login-container">
            <h2 class="text-center mb-4">Acceder</h2>
            <form action="inicio.html" method="GET">
                <!-- Por ahora el form redirige a inicio.html solo para probar la navegación -->
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" class="form-control" id="correo" placeholder="usuario@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>
            <a href="#" class="registro-link">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
